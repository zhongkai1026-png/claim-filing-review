<!DOCTYPE html>
<html lang="zh-CN">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4c6ef5"/>
              <stop offset="1" stop-color="#1d39c4"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#brandGrad)"/>
          <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 11v15"/>
            <path d="M10 15h28"/>
            <path d="M10 15l-6 9"/>

            <path d="M21.5 33v-3.5h5V33"/>

        </svg>
      </span>
      <div>
        <div class="brand-title">债权申报与审查系统</div>

      </div>
    </div>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar-right">
      <div class="project-switcher" id="projectSwitcher"></div>
      <span class="ai-badge" id="aiBadge">AI 未配置</span>
      <button class="btn btn-sm" onclick="openAISettings()" title="AI 模型配置">⚙️ AI 设置</button>
    </div>
  </div>
</header>

<main id="app" class="container"></main>

<div id="modalRoot"></div>

<script src="/js/vendor/echarts.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
